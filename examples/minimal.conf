server:
    interface: 127.0.0.1@5353
    interface: ::1@5353
    port: 5353
    verbosity: 1
    num-threads: 1
    do-daemonize: no

    # Loopback may recurse; everything else is refused by default.
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse

    # DNS rebinding protection is on by default: A/AAAA records pointing at
    # private ranges are dropped unless the owner name is under one of these
    # local-only namespaces.
    private-domain: "local"
    private-domain: "localdomain"
    private-domain: "lan"
    private-domain: "home"
    private-domain: "home.arpa"
    private-domain: "internal"
    private-domain: "intranet"
    private-domain: "corp"
    private-domain: "private"
    private-domain: "test"
    private-domain: "localhost"

# DNS over TLS (RFC 7858). The name after `#` is verified against the
# forwarder's certificate and, without `@port`, implies port 853.
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 8.8.8.8@853#dns.google
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 2606:4700:4700::1111@853#cloudflare-dns.com
    forward-first: no

# Plain DNS (UDP with TCP fallback). Fine for a trusted local upstream such as
# Unbound or Pi-hole on the same host; prefer DoT above when the network may
# intercept or rewrite port 53.
# forward-zone:
#     name: "."
#     forward-addr: 1.1.1.1@53
#     forward-addr: 2606:4700:4700::1111@53
#     forward-first: no

# Opt-in control socket. Only Unix sockets are supported: use an absolute path,
# optionally prefixed with `unix:`. The socket is created with mode 0600 and
# only the daemon's effective UID may connect. `control-port` exists for
# unbound.conf compatibility and must stay at 8953.
remote-control:
    control-enable: no
    control-interface: /run/dns-rs.sock
    control-port: 8953
