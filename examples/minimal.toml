[server]
interfaces = ["127.0.0.1@5353", "::1@5353"]
port = 5353
verbosity = 1
num_threads = 1
do_daemonize = false
access_control = [
    "127.0.0.0/8 allow",
    "::1/128 allow",
    "0.0.0.0/0 refuse",
    "::/0 refuse",
]

[[forward_zones]]
name = "."
forward_addrs = ["1.1.1.1@53", "2606:4700:4700::1111@53"]
forward_first = false

[remote_control]
enabled = false
interfaces = ["127.0.0.1"]
port = 8953
