[server]
interfaces = ["127.0.0.1@5353", "::1@5353"]
port = 5353
verbosity = 1
num_threads = 1
do_daemonize = false
access_control = [
    "127.0.0.0/8 allow",
    "::1/128 allow",
    "0.0.0.0/0 refuse",
    "::/0 refuse",
]

# DNS rebinding protection is on by default: A/AAAA records pointing at private
# ranges are dropped unless the owner name is under one of these local-only
# namespaces. Set private_address = [] to disable the filter entirely.
private_domain = [
    "local",
    "localdomain",
    "lan",
    "home",
    "home.arpa",
    "internal",
    "intranet",
    "corp",
    "private",
    "test",
    "localhost",
]

# Local namespace example. Built-in local names and private reverse zones are
# routed to the detected default gateway over plain DNS automatically. This
# shows an explicit override; never use a public or encrypted forwarder here.
[[forward_zones]]
name = "localdomain."
forward_addrs = ["192.168.1.1"]
tls_upstream = false
forward_first = false

# DNS over TLS (RFC 7858). The name after `#` is verified against the
# forwarder's certificate and, without `@port`, implies port 853.
[[forward_zones]]
name = "."
tls_upstream = true
forward_addrs = [
    "8.8.8.8@853#dns.google",
    "1.1.1.1@853#cloudflare-dns.com",
    "2606:4700:4700::1111@853#cloudflare-dns.com",
]
forward_first = false

# Plain DNS (UDP with TCP fallback). Fine for a trusted local upstream such as
# Unbound or Pi-hole on the same host; prefer DoT above when the network may
# intercept or rewrite port 53.
# [[forward_zones]]
# name = "."
# forward_addrs = ["1.1.1.1@53", "2606:4700:4700::1111@53"]
# forward_first = false

[remote_control]
enabled = false
# Control interfaces are absolute Unix socket paths, not listener addresses.
interfaces = ["/run/dns-rs/dns-rs.sock"]
port = 8953
