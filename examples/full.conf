# dns-rs full reference configuration (unbound.conf syntax)
#
# This file documents every option the unbound.conf front-end understands,
# with the values dns-rs uses when an option is omitted. Options that Unbound
# supports but dns-rs does not yet implement are ignored with a warning; they
# never stop the server from starting.
#
# Validate with:   dns-rs -c /path/to/full.conf checkconf
# Run with:        dns-rs -c /path/to/full.conf run
#
# Listener protocol is selected by port, as in Unbound:
#   * `port`        plain DNS over UDP and TCP
#   * `tls-port`    DNS-over-TLS (RFC 7858)
#   * `https-port`  DNS-over-HTTPS (RFC 8484)
# DoT and DoH are only enabled when tls-service-key and tls-service-pem are
# set, and an interface must use the matching port (for example
# `interface: 127.0.0.1@853`) to get the encrypted service.

server:
    # ------------------------------------------------------------------
    # Listeners
    # ------------------------------------------------------------------
    # Addresses to listen on. An explicit @port overrides `port`. Repeat the
    # address with @tls-port / @https-port to enable the encrypted listeners.
    interface: 127.0.0.1
    interface: ::1
    interface: 127.0.0.1@853
    interface: ::1@853
    interface: 127.0.0.1@443
    interface: ::1@443

    # Default plain DNS port for interfaces without an explicit port.
    port: 53

    # Port that serves DoT on interfaces bound to it. Default: 853.
    tls-port: 853
    # Port that serves DoH on interfaces bound to it. Default: 443.
    https-port: 443
    # HTTP path of the DoH endpoint. Default: "/dns-query".
    http-endpoint: "/dns-query"

    # PEM private key and certificate chain for downstream DoT and DoH.
    # Both must be set together; setting neither disables both listeners.
    # Create these files (for example with `openssl req -x509`) before `run`;
    # `checkconf` does not read them.
    tls-service-key: "/etc/dns-rs/tls/server.key"
    tls-service-pem: "/etc/dns-rs/tls/server.pem"

    # ------------------------------------------------------------------
    # Process and logging
    # ------------------------------------------------------------------
    # Log verbosity: 0 = warnings/errors, 1 = info, 2-3 = debug (adds one line
    # per query with cache hit/miss), 4-5 = trace. -v/-vv or RUST_LOG override
    # it.
    verbosity: 1
    # Worker threads for the Tokio runtime. Default: 1.
    num-threads: 2
    # Detach from the terminal. Default: no.
    do-daemonize: no
    # Drop privileges after binding. Default: unset (no change).
    # username: "dns-rs"
    # Chroot to this directory after startup. Default: unset.
    # chroot: "/var/lib/dns-rs"
    # Working directory. Default: unset.
    # directory: "/var/lib/dns-rs"
    # Log to this file instead of stderr. Default: unset.
    # logfile: "/var/log/dns-rs.log"
    # Write the process ID to this file. Default: unset.
    # pidfile: "/run/dns-rs.pid"
    # Send logs to syslog instead of stderr. Default: no.
    use-syslog: no

    # ------------------------------------------------------------------
    # Transports
    # ------------------------------------------------------------------
    # Enable IPv4/IPv6 service. At least one must stay enabled.
    do-ip4: yes
    do-ip6: yes
    # Enable plain UDP/TCP service. At least one must stay enabled.
    do-udp: yes
    do-tcp: yes
    # Source addresses for outgoing queries. Default: unset (kernel choice).
    # outgoing-interface: 192.0.2.10
    # outgoing-interface: 2001:db8::10

    # ------------------------------------------------------------------
    # Access control
    # ------------------------------------------------------------------
    # First matching network wins. Actions: allow, deny (drop), refuse
    # (REFUSED), allow_snoop, deny_non_local, refuse_non_local.
    # Default: allow loopback, refuse everything else.
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    access-control: 192.168.0.0/16 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse

    # ------------------------------------------------------------------
    # DNS rebinding protection
    # ------------------------------------------------------------------
    # Remove A/AAAA records and SVCB/HTTPS address hints whose address falls in
    # one of these ranges unless the record's owner name is under private-domain.
    # Local zones, auth zones, and stub zones are exempt. Defaults shown: RFC
    # 1918, link-local, IPv6 unique-local, and IPv4-mapped IPv6. Remove all
    # lines to disable.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10
    private-address: ::ffff:0:0/96
    # Allow a domain and its subdomains to contain private addresses. The
    # defaults cover common local-only namespaces; repeat to replace them with
    # your own list (for example, add "home.example").
    private-domain: "local"
    private-domain: "localdomain"
    private-domain: "lan"
    private-domain: "home"
    private-domain: "home.arpa"
    private-domain: "internal"
    private-domain: "intranet"
    private-domain: "corp"
    private-domain: "private"
    private-domain: "test"
    private-domain: "localhost"

    # ------------------------------------------------------------------
    # Hardening and protocol behaviour
    # ------------------------------------------------------------------
    # Reject out-of-bailiwick glue in referrals. Default: yes.
    harden-glue: yes
    # Reject unsigned data inside signed zones. Default: yes.
    harden-dnssec-stripped: yes
    # Maximum NSEC3 iteration count accepted during validation. Responses
    # with more iterations are treated as bogus instead of hash-bombing the
    # CPU (RFC 9276 section 3.2). Default: 150.
    nsec3-max-iterations: 150
    # "validator iterator" enables DNSSEC validation; "iterator" disables it.
    # Default: "validator iterator".
    module-config: "validator iterator"
    # Return bogus data with AD clear instead of SERVFAIL. Default: no.
    val-permissive-mode: no
    # Ignore the DNSSEC chain of trust towards a domain and its children.
    # Repeat for multiple domains. A trust anchor at or below the entry
    # re-enables validation for its subtree. This is a static negative trust
    # anchor (RFC 7646); it is never added automatically. Default: none.
    # domain-insecure: "broken.example"
    # Strip additional-section data that was not validated. Default: yes.
    val-clean-additional: yes
    # Minimise QNAMEs sent to authoritative servers (RFC 9156). Default: yes.
    qname-minimisation: yes
    # Do not relax minimisation on NODATA/CNAME. Default: no.
    qname-minimisation-strict: no
    # Randomise the case of outgoing QNAMEs (DNS 0x20). Default: yes.
    use-caps-for-id: yes

    # ------------------------------------------------------------------
    # EDNS and TTL bounds
    # ------------------------------------------------------------------
    # EDNS payload size advertised upstream (>= 512). Default: 1232.
    edns-buffer-size: 1232
    # Maximum UDP response size sent to clients (>= 512). Default: 1232.
    max-udp-size: 1232
    # Clamp TTLs entering and leaving the caches. Defaults: 0 / 86400.
    cache-min-ttl: 0
    cache-max-ttl: 86400
    # Refresh entries when less than 10% (or 3 seconds) of their TTL remains.
    prefetch: no
    # Serve an expired entry while it is refreshed (RFC 8767).
    serve-expired: no
    # Seconds to keep expired entries; 0 uses the built-in 30 second window.
    serve-expired-ttl: 0
    # TTL attached to a serve-expired reply.
    serve-expired-reply-ttl: 30
    # Clamp TTLs accepted from upstream servers. Defaults: 0 / 86400.
    min-ttl: 0
    max-ttl: 86400

    # ------------------------------------------------------------------
    # Rate limiting
    # ------------------------------------------------------------------
    # Responses per second per client IP; 0 disables limiting. Default: 0.
    ratelimit: 0
    # Truncate every Nth rate-limited query; 0 drops all of them. Default: 2.
    ratelimit-slip: 2
    # Maximum in-flight queries per client IP. Default: 64.
    max-concurrent-queries-per-client: 64
    # Maximum concurrent plain-TCP, DoT, and DoH connections per worker thread.
    # The effective limit is incoming-num-tcp * num-threads. Zero disables the
    # TCP, DoT, and DoH listeners.
    # Default: 10.
    incoming-num-tcp: 10

    # ------------------------------------------------------------------
    # DNSSEC trust anchors
    # ------------------------------------------------------------------
    # dns-rs ships the built-in root KSKs, so no anchor is required for
    # normal validation. Use these options to add or replace anchors.
    #
    # Inline anchor in zone-file syntax:
    # trust-anchor: "example.com. DS 12345 13 2 0123456789ABCDEF..."
    # File with one or more anchors in zone-file syntax:
    # trust-anchor-file: "/etc/dns-rs/trust-anchors.conf"
    # RFC 5011 automatic maintenance (created and updated by dns-rs):
    # auto-trust-anchor-file: "/var/lib/dns-rs/root.key"

    # ------------------------------------------------------------------
    # Upstream TLS verification
    # ------------------------------------------------------------------
    # Verify upstream DoT/DoH servers against the webpki root store.
    # Default: yes.
    tls-use-system-ca: yes
    # Extra PEM bundle for private CAs or pinning. Default: unset.
    # tls-cert-bundle: "/etc/dns-rs/upstream-ca.pem"


# ----------------------------------------------------------------------
# Forward zones
# ----------------------------------------------------------------------
# The most specific matching zone wins. `name: "."` forwards everything.
# Forwarders may be plain UDP (with automatic TCP fallback), DoT with
# `forward-tls-upstream: yes` and `addr@853#auth-name`, or DoH with an
# https:// URL. Encrypted forwarders skip 0x20 and DNS cookies.
# `forward-first` forwards first and falls back to iteration;
# `forward-fallback` iterates first and forwards only on a reachability
# failure (a blocked or intercepted port 53). Set at most one of the two.
forward-zone:
    name: "."
    # Connect to the IP forwarders below over DoT. This changes the transport,
    # not the port: without `@port`, an auth name implies 853.
    forward-tls-upstream: yes
    # DoT: address[@port][#TLS-authentication-name]. The name is verified
    # against the server certificate; omitting it accepts any name that chains
    # to a trusted CA, which is Unbound's behaviour.
    forward-addr: 8.8.8.8@853#dns.google
    forward-addr: 8.8.4.4@853#dns.google
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    # DoH: https://host[:port]/path. The hostname is resolved at startup.
    forward-addr: https://cloudflare-dns.com/dns-query
    # Fall back to iterative resolution when every forwarder fails.
    forward-first: no
    # Or iterate first and use these forwarders only when iteration cannot
    # reach authoritative servers (mutually exclusive with forward-first):
    # forward-fallback: yes

# Plain-DNS forwarder example (no TLS):
# forward-zone:
#     name: "corp.example."
#     forward-addr: 10.0.0.53
#     forward-first: no

# DoH-only forwarder example:
# forward-zone:
#     name: "."
#     forward-addr: https://dns.google/dns-query
#     forward-addr: https://cloudflare-dns.com/dns-query
#     forward-first: no


# ----------------------------------------------------------------------
# Remote control
# ----------------------------------------------------------------------
# Parsed for unbound.conf compatibility. The control socket is not served
# yet (M8); keep control-enable at no.
remote-control:
    control-enable: no
    control-interface: 127.0.0.1
    control-port: 8953
