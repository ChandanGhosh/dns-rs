[package]
name = "dns-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dns-config = { path = "../crates/dns-config" }
dns-proto = { path = "../crates/dns-proto" }
toml = "1.1"

[[bin]]
name = "decode_message"
path = "fuzz_targets/decode_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_unbound_config"
path = "fuzz_targets/parse_unbound_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_toml_config"
path = "fuzz_targets/parse_toml_config.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

# Keep the fuzz crate out of the resolver workspace.
[workspace]
