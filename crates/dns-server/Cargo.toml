[package]
name = "dns-server"
description = "DNS listeners and query pipeline for dns-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
arc-swap.workspace = true
dns-cache.workspace = true
dns-client.workspace = true
dns-config.workspace = true
dns-control.workspace = true
dns-dnssec.workspace = true
dns-iter.workspace = true
dns-proto.workspace = true
dashmap.workspace = true
data-encoding.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rustls.workspace = true
socket2.workspace = true
tokio-rustls.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time"] }
tokio-util.workspace = true
tracing.workspace = true
bytes = "1.10"
hickory-proto.workspace = true
ipnet.workspace = true

[features]
# Bench-only instrumentation (BENCH_PHASES=1 in scripts/bench-loopback.sh):
# times each stage of a query and prints `stats phases ...` every 250 ms.
# Off by default because every phase costs a clock read and an atomic.
phase-stats = []

# Linux-only batched UDP receives (`recvmmsg` in `recv_batch.rs`); other
# targets fall back to one `recvfrom` per datagram.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
dns-testutil.workspace = true
tempfile = "3"
rcgen = "0.13"
ring.workspace = true
tokio = { workspace = true, features = ["test-util", "time"] }

[lints]
workspace = true
