[package]
name = "dns-daemon"
description = "dns-rs resolver daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "dns-rs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
dns-config.workspace = true
dns-control.workspace = true
dns-proto.workspace = true
dns-server.workspace = true
mimalloc.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"

[features]
# Bench-only instrumentation (BENCH_ALLOCS=1 in scripts/bench-loopback.sh):
# a counting wrapper around the global allocator that prints `stats allocs=N`
# every 250 ms. Off by default because the counter adds an atomic to every
# allocation request.
alloc-stats = []
# Bench-only instrumentation (BENCH_PHASES=1 in scripts/bench-loopback.sh):
# per-phase query timings printed as `stats phases ...` every 250 ms. Off by
# default because every phase costs a clock read and an atomic.
phase-stats = ["dns-server/phase-stats"]

[lints]
workspace = true
