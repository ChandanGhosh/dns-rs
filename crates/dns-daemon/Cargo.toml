[package]
name = "dns-daemon"
description = "dns-rs resolver daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "dns-rs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
dns-config.workspace = true
dns-proto.workspace = true
dns-server.workspace = true
mimalloc.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Bench-only instrumentation (BENCH_ALLOCS=1 in scripts/bench-loopback.sh):
# a counting wrapper around the global allocator that prints `stats allocs=N`
# every 250 ms. Off by default because the counter adds an atomic to every
# allocation request.
alloc-stats = []

[lints]
workspace = true
