name: Container

# Normal main-branch publishing is automatic in CI. This workflow is for
# manual dev or hotfix builds. Add DOCKER_USERNAME and DOCKER_TOKEN to the
# repository secrets and run it with push enabled.
on:
    workflow_dispatch:
        inputs:
            push:
                description: Push the multi-arch image to Docker Hub
                type: boolean
                default: false
            tag:
                description: Image tag (for example 0.1.0 or dev)
                type: string
                required: true
                default: dev

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

env:
    IMAGE: docker.io/chandanghosh/dns-rs

jobs:
    verify:
        name: Build and verify
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - name: Build image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  load: true
                  tags: dns-rs:ci
                  build-args: |
                      VERSION=${{ inputs.tag }}
                      VCS_REF=${{ github.sha }}
                      BUILD_DATE=${{ github.event.repository.updated_at }}
                      SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Smoke test
              env:
                  IMAGE: dns-rs:ci
                  CONTAINER: dns-rs-ci
                  PORT: "15353"
                  SKIP_BUILD: "1"
              run: scripts/container-smoke.sh

    publish:
        name: Publish to Docker Hub
        if: ${{ inputs.push }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-qemu-action@v3
              with:
                  platforms: arm64
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ env.IMAGE }}:${{ inputs.tag }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  build-args: |
                      VERSION=${{ inputs.tag }}
                      VCS_REF=${{ github.sha }}
                      BUILD_DATE=${{ github.event.repository.updated_at }}
                      SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
                  sbom: true
                  provenance: mode=max
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
