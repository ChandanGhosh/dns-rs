name: CI

on:
    push:
        # Run CI on every branch so a feature branch is validated before a PR
        # is opened. Pull requests then run again against the merge result.
        branches: ["**"]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # Do not cancel a main-branch run while it is publishing. Feature-branch
    # pushes and pull-request runs are superseded as soon as a newer commit
    # arrives.
    cancel-in-progress: >-
        ${{ github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    branch:
        name: Branch name
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # Kept as a normal job (not job-level `if`) so it can be a required
            # status check for pull requests once branch protection is enabled.
            - name: Validate pull-request branch name
              env:
                  BRANCH: ${{ github.head_ref }}
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  set -euo pipefail
                  if [ "$EVENT_NAME" != "pull_request" ]; then
                      echo "not a pull request; skipping branch-name check"
                      exit 0
                  fi
                  pattern='^(feature|bugfix|chore|docs|test|refactor|perf|ci|build|hotfix|release|dependabot|renovate)/([A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*$'
                  if [[ ! "$BRANCH" =~ $pattern ]] || [[ "$BRANCH" == *..* ]]; then
                      echo "::error::branch '$BRANCH' must use <type>/<name>, where <type> is one of: feature, bugfix, chore, docs, test, refactor, perf, ci, build, hotfix, release, dependabot, renovate"
                      exit 1
                  fi
                  echo "branch '$BRANCH' follows the naming convention"

    fmt:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - run: cargo fmt --all --check

    clippy:
        name: Clippy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - uses: Swatinem/rust-cache@v2
            - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-nextest
            - run: cargo nextest run --workspace --all-features
            - run: cargo test --workspace --doc

    container:
        name: Container
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - name: Build image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  tags: dns-rs:ci
                  cache-from: type=gha,scope=container
                  cache-to: type=gha,mode=max,scope=container
            - name: Smoke test
              env:
                  IMAGE: dns-rs:ci
                  CONTAINER: dns-rs-ci
                  PORT: "15353"
                  SKIP_BUILD: "1"
              run: scripts/container-smoke.sh
            - uses: dtolnay/rust-toolchain@stable
            - name: Load stats (single and two workers)
              env:
                  BENCH_SERVER_IMAGE: dns-rs:ci
                  BENCH_NAMES: "4000"
                  BENCH_CONCURRENCY: "8"
                  BENCH_WARMUP: "5"
                  BENCH_DURATION: "15"
                  SKIP_BUILD: "1"
              run: |
                  set -o pipefail
                  log="${RUNNER_TEMP}/container-load.txt"
                  scripts/bench-loopback.sh 1 2 | tee "$log"
                  {
                      echo "### Container load stats"
                      echo ""
                      echo "Target: one worker >= 50,000 qps and p99 <= 1 ms. These are"
                      echo "informational only; the load step does not fail on a miss."
                      echo ""
                      echo '```'
                      cat "$log"
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
            - name: Image size gate
              run: |
                  size="$(docker image inspect --format '{{.Size}}' dns-rs:ci)"
                  limit=$((10 * 1024 * 1024))
                  echo "image size: $((size / 1024 / 1024)) MiB (limit 10 MiB)"
                  if [ "$size" -gt "$limit" ]; then
                      echo "::error::container image exceeds the 10 MiB size budget"
                      exit 1
                  fi
            - name: Vulnerability scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: dns-rs:ci
                  format: table
                  exit-code: "1"
                  ignore-unfixed: true
                  vuln-type: os,library
                  severity: CRITICAL,HIGH

    deny:
        name: Dependency policy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: EmbarkStudios/cargo-deny-action@v2
              with:
                  command: check

    audit:
        name: Security audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-audit
            - run: cargo audit

    fuzz:
        name: Fuzz smoke
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@nightly
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: fuzz -> target
            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-fuzz
            - run: |
                  for target in decode_message parse_unbound_config parse_toml_config; do
                      cargo fuzz run "$target" --target x86_64-unknown-linux-gnu -- -runs=20000 -max_total_time=60
                  done
              working-directory: fuzz

    version:
        name: Release version
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  # Tags and the base commit are needed to decide whether this
                  # change introduces a valid release version.
                  fetch-depth: 0
            - uses: dtolnay/rust-toolchain@stable
            - name: Validate the workspace version
              env:
                  BASE_SHA: >-
                      ${{ github.event_name == 'pull_request' &&
                      github.event.pull_request.base.sha || github.event.before }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  set -euo pipefail
                  version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
                  if [ -z "$version" ]; then
                      echo "::error::could not read [workspace.package] version from Cargo.toml"
                      exit 1
                  fi

                  # Every crate must inherit the single workspace version so a
                  # release cannot ship mismatched packages.
                  bad_versions="$(awk '
                      /^\[package\]/ { in_package = 1; next }
                      /^\[/ { in_package = 0 }
                      in_package && /^version[[:space:]]*=/ && $0 !~ /version\.workspace/ {
                          print FILENAME ":" FNR ": " $0
                      }' crates/*/Cargo.toml)"
                  if [ -n "$bad_versions" ]; then
                      echo "::error::crate manifests must use version.workspace = true"
                      echo "$bad_versions"
                      exit 1
                  fi

                  # A version bump must also update Cargo.lock. --locked fails
                  # instead of silently rewriting the lock in the runner.
                  cargo metadata --locked --format-version 1 >/dev/null

                  base_version=""
                  base_sha="${BASE_SHA:-}"
                  if [ "${EVENT_NAME:-}" = "pull_request" ] \
                      && [ -n "${HEAD_SHA:-}" ] \
                      && [ -n "$base_sha" ]; then
                      # Compare with the branch point, not the current base tip:
                      # a release merged into main must not hide a PR that
                      # bumps to the version that was just released.
                      merged_base="$(git merge-base "$HEAD_SHA" "$base_sha" 2>/dev/null || true)"
                      if [ -n "$merged_base" ]; then
                          base_sha="$merged_base"
                      fi
                  fi
                  if [ -n "$base_sha" ] \
                      && [ "$base_sha" != "0000000000000000000000000000000000000000" ]; then
                      base_version="$(git show "$base_sha:Cargo.toml" 2>/dev/null \
                          | sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' \
                          | head -1 || true)"
                  fi
                  if [ -z "$base_version" ]; then
                      echo "no base version available; skipping release-version check"
                      exit 0
                  fi
                  if [ "$version" = "$base_version" ]; then
                      echo "version unchanged at $version; no release will be cut"
                      exit 0
                  fi

                  tags_out="$(git ls-remote --tags origin)"
                  latest_version="$(printf '%s\n' "$tags_out" | awk '
                      $2 ~ /^refs\/tags\/v/ && $2 !~ /\^\{\}$/ {
                          v = $2
                          sub(/^refs\/tags\/v/, "", v)
                          if (v != "") print v
                      }' | sort -V | tail -1)"

                  if [ -n "$latest_version" ] \
                      && [ "$(printf '%s\n%s\n' "$latest_version" "$version" | sort -V | tail -1)" != "$version" ]; then
                      echo "::error::workspace version $version is not newer than the latest release tag v$latest_version"
                      exit 1
                  fi
                  if [ "$version" = "$latest_version" ]; then
                      # A tag pushed by hand at this exact commit is the release
                      # for this commit, which the publish job accepts; do not
                      # fail the run for it. A tag at any other commit means the
                      # version was already used for a different release.
                      tag_sha="$(printf '%s\n' "$tags_out" | awk -v t="refs/tags/v$version" '
                          $2 == t "^{}" { print $1; done = 1; exit }
                          $2 == t { base = $1 }
                          END { if (!done && base != "") print base }')"
                      if [ -n "${GITHUB_SHA:-}" ] && [ "$tag_sha" = "$GITHUB_SHA" ]; then
                          echo "::notice::version $version is already released as v$version at this commit"
                          exit 0
                      fi
                      echo "::error::workspace version $version was already released as v$latest_version; bump it again"
                      exit 1
                  fi
                  echo "version $version is newer than ${latest_version:+v$latest_version}; a release will be cut"
            - name: Validate package recipe versions
              run: |
                  set -euo pipefail
                  version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
                  spec_version="$(sed -n 's/^Version:[[:space:]]*//p' packaging/rpm/dns-rs.spec | head -1)"
                  deb_version="$(sed -n '1s/^dns-rs (\([^)]*\)).*/\1/p' packaging/debian/changelog)"
                  if [[ "$spec_version" != "$version" || "$deb_version" != "$version" ]]; then
                      echo "::error::package recipes must use the workspace version $version (spec=$spec_version, debian=$deb_version)"
                      exit 1
                  fi

    publish:
        name: Publish container
        needs: [fmt, clippy, test, container, deny, audit, fuzz, version]
        if: >
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            github.repository == 'ChandanGhosh/dns-rs'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
        concurrency:
            group: publish-main
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7
              with:
                  # Full history and tags: the release notes diff the release
                  # commit against the previous `v*` tag to list what changed.
                  fetch-depth: 0
            - name: Check for a newer main commit
              id: latest
              run: |
                  git fetch --no-tags origin main
                  if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
                      echo "::notice::Skipping publish; a newer main commit exists."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: Resolve image and release metadata
              id: meta
              if: steps.latest.outputs.skip != 'true'
              run: |
                  set -euo pipefail
                  version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
                  if [ -z "$version" ]; then
                      echo "::error::could not read [workspace.package] version from Cargo.toml"
                      exit 1
                  fi

                  date_tag="$(date -u +%d%m%Y)"
                  build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "date_tag=$date_tag" >> "$GITHUB_OUTPUT"
                  echo "build_date=$build_date" >> "$GITHUB_OUTPUT"

                  # A release is cut when Cargo.toml carries a version newer than
                  # every existing `v*` tag. Re-running the same commit republishes
                  # the version tags but never creates a second release. Annotated
                  # tags have a separate tag object, so the peeled `^{}` line is
                  # the commit.
                  tags_out="$(git ls-remote --tags origin)"
                  versions="$(printf '%s\n' "$tags_out" | awk '
                      $2 ~ /^refs\/tags\/v/ && $2 !~ /\^\{\}$/ {
                          v = $2
                          sub(/^refs\/tags\/v/, "", v)
                          if (v != "") print v
                      }' | sort -V)"
                  latest_version="$(printf '%s\n' "$versions" | tail -1)"
                  tag_sha="$(printf '%s\n' "$tags_out" | awk -v t="refs/tags/v$version" '
                      $2 == t "^{}" { print $1; done = 1; exit }
                      $2 == t { base = $1 }
                      END { if (!done && base != "") print base }')"

                  newest=false
                  if [ -z "$latest_version" ] \
                      || [ "$(printf '%s\n%s\n' "$latest_version" "$version" | sort -V | tail -1)" = "$version" ]; then
                      newest=true
                  fi

                  release=false
                  if [ "$newest" = true ] \
                      && { [ "$version" != "$latest_version" ] || [ "$tag_sha" = "$GITHUB_SHA" ]; }; then
                      release=true
                  fi
                  echo "release=$release" >> "$GITHUB_OUTPUT"
                  echo "::notice::version $version, image tag $date_tag, release $release"

                  # The date tag always moves; version tags only exist once the
                  # workspace version is bumped, and are never moved afterwards.
                  tags="docker.io/chandanghosh/dns-rs:$date_tag"
                  if [ "$release" = true ]; then
                      tags="$tags"$'\n'"docker.io/chandanghosh/dns-rs:$version"$'\n'"docker.io/chandanghosh/dns-rs:latest"
                  fi
                  {
                      echo "tags<<EOF"
                      echo "$tags"
                      echo "EOF"
                  } >> "$GITHUB_OUTPUT"

                  # The release notes list the commits between the previous
                  # release tag and the one being cut. Derive that tag as the
                  # highest version strictly below this one rather than
                  # assuming the current tag is absent, so a manually pushed
                  # tag cannot suppress the changelog.
                  prev_version="$(printf '%s\n%s\n' "$versions" "$version" | sort -V | awk -v cur="$version" '
                      $0 == cur { if (have) print prev; exit }
                      { prev = $0; have = 1 }')"
                  if [ "$release" = true ] && [ -n "$prev_version" ]; then
                      echo "prev_tag=v$prev_version" >> "$GITHUB_OUTPUT"
                  fi
            - uses: docker/setup-buildx-action@v4
              if: steps.latest.outputs.skip != 'true'
            - uses: docker/login-action@v3
              if: steps.latest.outputs.skip != 'true'
              with:
                  username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN || secrets.DOCKERHUB_TOKEN }}
            - name: Build and push multi-arch image
              id: push
              if: steps.latest.outputs.skip != 'true'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  build-args: |
                      VERSION=${{ steps.meta.outputs.version }}
                      VCS_REF=${{ github.sha }}
                      BUILD_DATE=${{ steps.meta.outputs.build_date }}
                      SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
                  sbom: true
                  provenance: mode=max
                  cache-from: type=gha,scope=container
                  cache-to: type=gha,mode=max,scope=container
            - name: Build release tarballs
              if: steps.latest.outputs.skip != 'true' && steps.meta.outputs.release == 'true'
              env:
                  VERSION: ${{ steps.meta.outputs.version }}
                  BUILD_DATE: ${{ steps.meta.outputs.build_date }}
              run: |
                  set -euo pipefail
                  mkdir -p release/bin release/artifacts
                  for arch in amd64 arm64; do
                      # Reuse the Dockerfile's cross-compile stage instead of
                      # duplicating its musl toolchain setup here.
                      docker buildx build \
                          --platform "linux/$arch" \
                          --target release-binary \
                          --build-arg "VERSION=$VERSION" \
                          --build-arg "BUILD_DATE=$BUILD_DATE" \
                          --output "type=local,dest=$PWD/release/bin/$arch" \
                          --cache-from=type=gha,scope=container \
                          .
                      cp "release/bin/$arch/dns-rs" "release/bin/dns-rs-$arch"
                  done
                  scripts/build-release-tarballs.sh \
                      --version "$VERSION" \
                      --input-dir release/bin \
                      --output-dir release/artifacts
            - name: Create GitHub release
              if: steps.latest.outputs.skip != 'true' && steps.meta.outputs.release == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.meta.outputs.version }}
                  PREV_TAG: ${{ steps.meta.outputs.prev_tag }}
                  DATE_TAG: ${{ steps.meta.outputs.date_tag }}
                  BUILD_DATE: ${{ steps.meta.outputs.build_date }}
                  DIGEST: ${{ steps.push.outputs.digest }}
                  REPO_URL: ${{ github.server_url }}/${{ github.repository }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  set -euo pipefail
                  tag="v$VERSION"

                  if gh release view "$tag" >/dev/null 2>&1; then
                      echo "::notice::release $tag already exists; refreshing artifacts"
                      gh release upload "$tag" release/artifacts/*.tar.gz \
                          release/artifacts/SHA256SUMS --clobber
                      exit 0
                  fi

                  notes="$(mktemp)"
                  {
                      # Human-readable changelog: every commit since the
                      # previous release, bulleted and linked. Skipped (rather
                      # than failing) when there is no previous tag to diff.
                      if [ -n "${PREV_TAG:-}" ] && git cat-file -e "$PREV_TAG" 2>/dev/null; then
                          log="$(git log --no-merges --format='%H %s' "$PREV_TAG..$GITHUB_SHA")"
                          if [ -n "$log" ]; then
                              printf "## What's changed\n\n"
                              printf '%s\n' "$log" | awk -v url="$REPO_URL/commit" '{
                                  sha = $1
                                  sub(/^[0-9a-f]+ /, "")
                                  printf "- [%s](%s/%s) %s\n", substr(sha, 1, 7), url, sha, $0
                              }'
                              printf '\n**Full Changelog**: %s/compare/%s...%s\n\n' \
                                  "$REPO_URL" "$PREV_TAG" "$tag"
                          fi
                      fi

                      printf '## Native install bundles\n\n'
                      printf 'Static musl binaries with the systemd unit and default config:\n\n'
                      printf -- '- `dns-rs-%s-linux-amd64.tar.gz`\n' "$VERSION"
                      printf -- '- `dns-rs-%s-linux-arm64.tar.gz`\n' "$VERSION"
                      printf -- '- `SHA256SUMS`\n\n'
                      printf '## Container images\n\n'
                      printf 'Container images published for this release:\n\n'
                      printf -- '- `docker.io/chandanghosh/dns-rs:%s`\n' "$VERSION"
                      printf -- '- `docker.io/chandanghosh/dns-rs:latest`\n'
                      if [ -n "$DIGEST" ]; then
                          printf -- '- Immutable digest: `docker.io/chandanghosh/dns-rs@%s`\n' "$DIGEST"
                      fi
                      printf '\n'
                      printf -- '- Platforms: `linux/amd64`, `linux/arm64`\n'
                      printf -- '- Revision: `%s`\n' "$GITHUB_SHA"
                      printf -- '- Built: `%s`\n' "$BUILD_DATE"
                      printf -- '- Workflow run: %s\n\n' "$RUN_URL"
                      printf 'The `%s` tag is the mutable edge build and may move to a newer\n' "$DATE_TAG"
                      printf 'revision later the same day. Pin `%s` or the digest above for a\n' "$VERSION"
                      printf 'stable image.\n'
                  } >"$notes"

                  remote_tag_sha="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" \
                      | awk -v t="refs/tags/$tag" '
                          $2 == t "^{}" { print $1; done = 1; exit }
                          $2 == t { base = $1 }
                          END { if (!done && base != "") print base }')"
                  if [ -z "$remote_tag_sha" ]; then
                      git -c user.name="github-actions[bot]" \
                          -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                          tag -a "$tag" -m "dns-rs $VERSION" "$GITHUB_SHA"
                      git push origin "refs/tags/$tag"
                  elif [ "$remote_tag_sha" != "$GITHUB_SHA" ]; then
                      echo "::error::$tag already points at $remote_tag_sha, not $GITHUB_SHA"
                      exit 1
                  fi

                  gh release create "$tag" \
                      --verify-tag \
                      --title "dns-rs $VERSION" \
                      --notes-file "$notes" \
                      --latest \
                      release/artifacts/*.tar.gz \
                      release/artifacts/SHA256SUMS
