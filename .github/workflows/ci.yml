name: CI

on:
    push:
        branches: [main, master]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    fmt:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            - run: cargo fmt --all --check

    clippy:
        name: Clippy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - uses: Swatinem/rust-cache@v2
            - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-nextest
            - run: cargo nextest run --workspace --all-features
            - run: cargo test --workspace --doc

    container:
        name: Container
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - name: Build image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  load: true
                  tags: dns-rs:ci
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - name: Smoke test
              env:
                  IMAGE: dns-rs:ci
                  CONTAINER: dns-rs-ci
                  PORT: "15353"
                  SKIP_BUILD: "1"
              run: scripts/container-smoke.sh
            - name: Image size gate
              run: |
                  size="$(docker image inspect --format '{{.Size}}' dns-rs:ci)"
                  limit=$((10 * 1024 * 1024))
                  echo "image size: $((size / 1024 / 1024)) MiB (limit 10 MiB)"
                  if [ "$size" -gt "$limit" ]; then
                      echo "::error::container image exceeds the 10 MiB size budget"
                      exit 1
                  fi
            - name: Vulnerability scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  image-ref: dns-rs:ci
                  format: table
                  exit-code: "1"
                  ignore-unfixed: true
                  vuln-type: os,library
                  severity: CRITICAL,HIGH

    deny:
        name: Dependency policy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: EmbarkStudios/cargo-deny-action@v2
              with:
                  command: check

    audit:
        name: Security audit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-audit
            - run: cargo audit

    fuzz:
        name: Fuzz smoke
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@nightly
              with:
                  targets: x86_64-unknown-linux-musl
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: fuzz -> target
            - uses: taiki-e/install-action@v2
              with:
                  tool: cargo-fuzz
            - run: cargo fuzz run decode_message -- -runs=20000 -max_total_time=60
              working-directory: fuzz
