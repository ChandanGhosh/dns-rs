[workspace]
resolver = "3"
members = [
    "crates/dns-proto",
    "crates/dns-config",
    "crates/dns-cache",
    "crates/dns-client",
    "crates/dns-iter",
    "crates/dns-dnssec",
    "crates/dns-filter",
    "crates/dns-server",
    "crates/dns-control",
    "crates/dns-daemon",
    "crates/dns-testutil",
]
default-members = ["crates/dns-daemon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
authors = ["dns-rs contributors"]

[workspace.dependencies]
anyhow = "1.0"
arc-swap = "1.7"
clap = { version = "4.6", features = ["derive"] }
dashmap = "6.1"
data-encoding = "2"
hickory-proto = { version = "0.26", features = ["dnssec-ring"] }
http-body-util = "0.1"
hyper = { version = "1.7", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
ipnet = "2.12"
moka = { version = "0.12", features = ["sync"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.54", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Internal crates
dns-cache = { path = "crates/dns-cache" }
dns-client = { path = "crates/dns-client" }
dns-config = { path = "crates/dns-config" }
dns-control = { path = "crates/dns-control" }
dns-dnssec = { path = "crates/dns-dnssec" }
dns-filter = { path = "crates/dns-filter" }
dns-iter = { path = "crates/dns-iter" }
dns-proto = { path = "crates/dns-proto" }
dns-server = { path = "crates/dns-server" }
dns-testutil = { path = "crates/dns-testutil" }

[workspace.lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
