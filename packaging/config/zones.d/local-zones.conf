# Default local-zone declarations for common router and SOHO local domains.
#
# Included from the server: block of dns-rs.conf. These zones are transparent:
# dns-rs never sends them to a public or encrypted resolver. When a default
# gateway is present it receives these queries over plain DNS; without one the
# resolver returns REFUSED. Do not change them to `static` or `always_refuse`
# unless you intend to answer or block the whole namespace locally.
#
# Add router-specific suffixes here, keeping the `transparent` type, so local
# data and gateway forwarding continue to work for names below them. Add
# records with `local-data:` lines in this file or another zones.d/*.conf file.

local-zone: "local." transparent
local-zone: "localdomain." transparent
local-zone: "lan." transparent
local-zone: "home." transparent
local-zone: "home.arpa." transparent
local-zone: "internal." transparent
local-zone: "intranet." transparent
local-zone: "corp." transparent
local-zone: "private." transparent

# `localhost.` is answered from the resolver's built-in local data and must not
# be declared here: a transparent local-zone would override that answer and
# send the query to the gateway.
#
# RFC 1918 and ULA reverse zones are also built-in protected namespaces. They
# are not repeated here; repeating a local-zone name is a configuration error.
