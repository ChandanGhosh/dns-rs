# Default configuration for the dns-rs container image.
#
# This file is a safe starting point, not a public resolver. It listens on port
# 53 inside the container (grant NET_BIND_SERVICE, or publish a high port), and
# permits only loopback, Docker bridge, and RFC 1918 clients. To change it,
# mount a configuration directory at /etc/dns-rs; the daemon re-reads this file
# on SIGHUP or `control reload`.

[server]
interfaces = ["0.0.0.0"]
port = 53
verbosity = 1
num_threads = 2
do_daemonize = false
do_ip4 = true
# Keep IPv6 off by default: many container networks do not provide it. This
# also stops outgoing queries to IPv6 root servers and glue. Enable do_ip6 and
# add an "::" interface when the runtime has working IPv6.
do_ip6 = false
do_udp = true
do_tcp = true

# A recursive resolver must not be an open resolver. Rules are evaluated in
# order and the first match wins; clients that match no rule are refused.
# 172.16.0.0/12 covers the default Docker bridge network.
access_control = [
    "127.0.0.0/8 allow",
    "10.0.0.0/8 allow",
    "172.16.0.0/12 allow",
    "192.168.0.0/16 allow",
    "0.0.0.0/0 refuse",
]

# IPv6 is disabled above (`do_ip6 = false`), so this list is IPv4-only. To
# serve IPv6 clients, set `do_ip6 = true`, add an IPv6 interface such as
# `"::"`, and use this list instead:
#
# access_control = [
#     "127.0.0.0/8 allow",
#     "::1/128 allow",
#     "10.0.0.0/8 allow",
#     "172.16.0.0/12 allow",
#     "192.168.0.0/16 allow",
#     "fc00::/7 allow",   # unique-local; home networks use fd00::/8
#     "fe80::/10 allow",  # link-local
#     "0.0.0.0/0 refuse",
#     "::/0 refuse",
# ]
#
# `fc80::/7` normalizes to the same range as `fc00::/7` but is misleading;
# use the canonical prefix. `172::/7` is not IPv4 172.16.0.0/12: it is an
# IPv6 prefix that normalizes to `::/7`.

harden_glue = true
dnssec_validation = true
qname_minimisation = true
use_caps_for_id = true

# RFC 5011 state. Uncomment and mount a volume at /var/lib/dns-rs when you
# want automatic trust-anchor updates to survive restarts.
# auto_trust_anchor_file = "/var/lib/dns-rs/root.key"

# Downstream DoT/DoH. Mount the certificate files and enable the matching
# interfaces, for example ["0.0.0.0@853", "0.0.0.0@443"].
# tls_service_key = "/etc/dns-rs/tls/server.key"
# tls_service_pem = "/etc/dns-rs/tls/server.pem"

# Forward zones. Use one when the network blocks or rewrites port 53, or when
# only a recursive upstream is reachable. `forward_fallback = true` keeps local
# iteration as the primary path and asks these forwarders only when iteration
# cannot reach authoritative servers; `forward_first = true` is the opposite
# direction and the two cannot be combined. DoT on port 853 bypasses a network
# that intercepts port 53.
#
# [[forward_zones]]
# name = "."
# forward_fallback = true
# tls_upstream = true
# forward_addrs = [
#     "1.1.1.1@853#cloudflare-dns.com",
#     "1.0.0.1@853#cloudflare-dns.com",
# ]

[remote_control]
enabled = false
