# Default configuration for the dns-rs container image (unbound.conf syntax).
#
# This file is a safe starting point, not a public resolver. It listens on port
# 53 inside the container (grant NET_BIND_SERVICE, or publish a high port), and
# permits only loopback, Docker bridge, and RFC 1918 clients. To change it,
# mount a configuration directory at /etc/dns-rs; the daemon re-reads this file
# on SIGHUP or `control reload`.
#
# The `.conf` name selects the Unbound-compatible parser, which supports
# `include:` and `include-toplevel:`. That makes this format the default: keep
# hand-written settings here and drop generated zones or blocklists in as
# separate files instead of rewriting one large configuration.
#
# Validate with: dns-rs -c /etc/dns-rs/dns-rs.conf checkconf
# A file ending in `.toml` is parsed as native TOML instead; see
# docs/container.md for that format. Never mix the two syntaxes in one file.

server:
    interface: 0.0.0.0
    port: 53
    verbosity: 1
    num-threads: 2
    do-daemonize: no
    do-ip4: yes
    # Keep IPv6 off by default: many container networks do not provide it. This
    # also stops outgoing queries to IPv6 root servers and glue. Enable do-ip6
    # and add an "::" interface when the runtime has working IPv6.
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # A recursive resolver must not be an open resolver. Rules are evaluated in
    # order and the first match wins; clients that match no rule are refused.
    # 172.16.0.0/12 covers the default Docker bridge network.
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    access-control: 0.0.0.0/0 refuse

    # IPv6 is disabled above, so this list is IPv4-only. To serve IPv6 clients,
    # set `do-ip6: yes`, add an IPv6 interface such as `::`, and use this list:
    #
    # access-control: ::1/128 allow
    # access-control: fc00::/7 allow   # unique-local; home networks use fd00::/8
    # access-control: fe80::/10 allow  # link-local
    # access-control: ::/0 refuse
    #
    # `fc80::/7` normalizes to the same range as `fc00::/7` but is misleading;
    # use the canonical prefix. `172::/7` is not IPv4 172.16.0.0/12: it is an
    # IPv6 prefix that normalizes to `::/7`.

    harden-glue: yes
    module-config: "validator iterator"
    qname-minimisation: yes
    use-caps-for-id: yes

    # RFC 5011 state. Uncomment and mount a volume at /var/lib/dns-rs when you
    # want automatic trust-anchor updates to survive restarts.
    # auto-trust-anchor-file: "/var/lib/dns-rs/root.key"

    # Downstream DoT/DoH. Mount the certificate files and add interfaces bound
    # to the matching port, for example `interface: 0.0.0.0@853` and
    # `interface: 0.0.0.0@443`.
    # tls-service-key: "/etc/dns-rs/tls/server.key"
    # tls-service-pem: "/etc/dns-rs/tls/server.pem"

    # Local zones and blocklists. `include:` keeps the current server: block,
    # so the included file can contain bare `local-zone:` lines. Repeat
    # `local-data:` for records, or use `auth-zone:` for a real zone file.
    #
    # include: "blocklist.conf"
    #
    # local-zone: "internal.example." static
    # local-data: "router.home. 3600 IN A 192.168.1.1"

# Forward zones. Use one when the network blocks or rewrites port 53, or when
# only a recursive upstream is reachable. `forward-fallback: yes` keeps local
# iteration as the primary path and asks these forwarders only when iteration
# cannot reach authoritative servers; `forward-first: yes` is the opposite
# direction and the two cannot be combined. DoT on port 853 bypasses a network
# that intercepts port 53.
#
# forward-zone:
#     name: "."
#     forward-fallback: yes
#     forward-tls-upstream: yes
#     forward-addr: 1.1.1.1@853#cloudflare-dns.com
#     forward-addr: 1.0.0.1@853#cloudflare-dns.com

remote-control:
    control-enable: no
