# Default configuration for the dns-rs container image.
#
# This file is a safe starting point, not a public resolver. It listens on port
# 53 inside the container (grant NET_BIND_SERVICE, or publish a high port), and
# permits only loopback, Docker bridge, and RFC 1918 clients. Mount your own
# configuration at /etc/dns-rs/dns-rs.toml to change it.

[server]
interfaces = ["0.0.0.0"]
port = 53
verbosity = 1
num_threads = 2
do_daemonize = false
do_ip4 = true
# Keep IPv6 off by default: many container networks do not provide it. Enable
# do_ip6 and add an "::" interface when the runtime has working IPv6.
do_ip6 = false
do_udp = true
do_tcp = true

# A recursive resolver must not be an open resolver. Add the networks that
# should use it. 172.16.0.0/12 covers the default Docker bridge network.
access_control = [
    "127.0.0.0/8 allow",
    "10.0.0.0/8 allow",
    "172.16.0.0/12 allow",
    "192.168.0.0/16 allow",
    "0.0.0.0/0 refuse",
]

harden_glue = true
dnssec_validation = true
qname_minimisation = true
use_caps_for_id = true

# RFC 5011 state. Uncomment and mount a volume at /var/lib/dns-rs when you
# want automatic trust-anchor updates to survive restarts.
# auto_trust_anchor_file = "/var/lib/dns-rs/root.key"

# Downstream DoT/DoH. Mount the certificate files and enable the matching
# interfaces, for example ["0.0.0.0@853", "0.0.0.0@443"].
# tls_service_key = "/etc/dns-rs/tls/server.key"
# tls_service_pem = "/etc/dns-rs/tls/server.pem"

[remote_control]
enabled = false
